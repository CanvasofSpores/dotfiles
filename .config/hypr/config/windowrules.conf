# ▀▄▀▄▀ █ █░▀█ █▄▀ █▄█ ▀▄▀▄▀   █▀▄ █▄█ █▄▄ ██▄ ▄█

# See https://wiki.hyprland.org/Configuring/Window-Rules/

# '$&' is a hyde specific shorthand for "override" \\ analogous to a reference
# This symbol indicates that the following values will override the default configuration

windowrule = opacity 0.90 0.90 1, match:class ^(firefox)$
windowrule = opacity 0.90 0.90 1, match:class ^(Brave-browser)$
windowrule = opacity 0.80 0.80 1, match:class ^(code-oss)$
windowrule = opacity 0.80 0.80 1, match:class ^([Cc]ode)$
windowrule = opacity 0.80 0.80 1, match:class ^(code-url-handler)$
windowrule = opacity 0.80 0.80 1, match:class ^(code-insiders-url-handler)$
windowrule = opacity 0.80 0.80 1, match:class ^(kitty)$
windowrule = opacity 0.80 0.80 1, match:class ^(thunar)$
windowrule = opacity 0.80 0.80 1, match:class ^(org.kde.ark)$, float on
windowrule = opacity 0.80 0.80 1, match:class ^(nwg-look)$, float on
windowrule = opacity 0.80 0.80 1, match:class ^(qt5ct)$, float on
windowrule = opacity 0.80 0.80 1, match:class ^(qt6ct)$, float on
windowrule = opacity 0.80 0.80 1, match:class ^(kvantummanager)$, float on
windowrule = opacity 0.80 0.70 1, match:class ^(org.pulseaudio.pavucontrol)$, float on
windowrule = opacity 0.80 0.70 1, match:title ^(Syncthing Tray)$, float on, persistent_size on, center on
windowrule = opacity 0.80 0.70 1, match:class ^(blueman-manager)$, float on
windowrule = opacity 0.80 0.70 1, match:class ^(nm-applet)$, float on
windowrule = opacity 0.80 0.70 1, match:class ^(nm-connection-editor)$, float on
windowrule = opacity 0.80 0.70 1, match:class ^(org.kde.polkit-kde-authentication-agent-1)$, float on
windowrule = opacity 0.80 0.70 1, match:class ^(polkit-gnome-authentication-agent-1)$
windowrule = opacity 0.80 0.70 1, match:class ^(org.freedesktop.impl.portal.desktop.gtk)$
windowrule = opacity 0.80 0.70 1, match:class ^(org.freedesktop.impl.portal.desktop.hyprland)$
windowrule = opacity 0.70 0.70 1, match:class ^([Ss]team)$
windowrule = opacity 0.70 0.70 1, match:class ^(steamwebhelper)$
windowrule = opacity 0.70 0.70 1, match:class ^([Ss]potify)$
windowrule = opacity 0.70 0.70 1, match:initial_title ^(Spotify Free)$
windowrule = opacity 0.70 0.70 1, match:initial_title ^(Spotify Premium)$

windowrule = opacity 0.90 0.90, match:class ^(com.github.rafostar.Clapper)$ # Clapper-Gtk, float on
windowrule = opacity 0.80 0.80, match:class ^(com.github.tchx84.Flatseal)$ # Flatseal-Gtk
windowrule = opacity 0.80 0.80, match:class ^(hu.kramo.Cartridges)$ # Cartridges-Gtk
windowrule = opacity 0.80 0.80, match:class ^(com.obsproject.Studio)$ # Obs-Qt
windowrule = opacity 0.80 0.80, match:class ^(gnome-boxes)$ # Boxes-Gtk
windowrule = opacity 0.80 0.80, match:class ^(vesktop)$ # Vesktop
windowrule = opacity 0.80 0.80, match:class ^(discord)$ # Discord-Electron
windowrule = opacity 0.80 0.80, match:class ^(WebCord)$ # WebCord-Electron
windowrule = opacity 0.80 0.80, match:class ^(ArmCord)$ # ArmCord-Electron
windowrule = opacity 0.80 0.80, match:title ^(Telegram)$ # Telegram-Desktop
windowrule = opacity 0.80 0.80, match:class ^(app.drey.Warp)$ # Warp-Gtk, float on
windowrule = opacity 0.80 0.80, match:class ^(net.davidotek.pupgui2)$ # ProtonUp-Qt, float on
windowrule = opacity 0.80 0.80, match:class ^(yad)$ # Protontricks-Gtk, float on
windowrule = opacity 0.80 0.80, match:class ^(Signal)$ # Signal-Gtk, float on
windowrule = opacity 0.80 0.80, match:class ^(io.github.alainm23.planify)$ # planify-Gtk, float on
windowrule = opacity 0.80 0.80, match:class ^(io.gitlab.theevilskeleton.Upscaler)$ # Upscaler-Gtk, float on
windowrule = opacity 0.80 0.80, match:class ^(com.github.unrud.VideoDownloader)$ # VideoDownloader-Gtk
windowrule = opacity 0.80 0.80, match:class ^(io.gitlab.adhami3310.Impression)$ # Impression-Gtk, float on
windowrule = opacity 0.80 0.80, match:class ^(io.missioncenter.MissionCenter)$ # MissionCenter-Gtk, float on
windowrule = opacity 0.80 0.80, match:class ^(io.github.flattool.Warehouse)$ # Warehouse-Gtk

windowrule = float on, match:class ^(org.kde.dolphin)$, match:title ^(Progress Dialog — Dolphin)$
windowrule = float on, match:class ^(org.kde.dolphin)$, match:title ^(Copying — Dolphin)$
windowrule = float on, match:title ^(About Mozilla Firefox)$
windowrule = float on, match:class ^(firefox)$, match:title ^(Picture-in-Picture)$
windowrule = float on, match:class ^(firefox)$, match:title ^(Library)$
windowrule = float on, match:class ^(kitty)$, match:title ^(top)$
windowrule = float on, match:class ^(kitty)$, match:title ^(btop)$
windowrule = float on, match:class ^(kitty)$, match:title ^(htop)$
windowrule = float on, match:class ^(vlc)$
windowrule = float on, match:class ^(eog)$ # Imageviewer-Gtk
windowrule = float on, match:class ^(com.github.unrud.VideoDownloader)$ # VideoDownloader-Gkk

windowrule = monitor DP-2, match:class ^(discord)$, workspace 2
windowrule = monitor DP-2, match:title ^(Telegram)$, workspace 3


# common modals
windowrule = float on, match:initial_title ^(Open File)$
windowrule = float on, match:title ^(Choose Files)$
windowrule = float on, match:title ^(Save As)$
windowrule = float on, match:title ^(Confirm to replace files)$
windowrule = float on, match:title ^(File Operation Progress)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$

# █░░ ▄▀█ █▄█ █▀▀ █▀█   █▀█ █░█ █░░ █▀▀ █▀
# █▄▄ █▀█ ░█░ ██▄ █▀▄   █▀▄ █▄█ █▄▄ ██▄ ▄█

layerrule = blur on, match:namespace rofi, ignore_alpha 0
layerrule = blur on, match:namespace notifications, ignore_alpha 0
layerrule = blur on, match:namespace swaync-notification-window, ignore_alpha 0
layerrule = blur on, match:namespace swaync-control-center, ignore_alpha 0
layerrule = blur on, match:namespace logout_dialog


#
# Gaming
#

workspace = name:gaming, opacity 1
workspace = name:gaming, gapsin:0, gapsout:0
workspace = name:gaming, border:false, bordersize:0

windowrule = maximize on, match:class ^steam_app\d+$
windowrule = monitor 0, match:class ^steam_app_\d+$
windowrule = match:workspace name gaming, match:class ^steam_app_\d+$


#
# Special Workspaces
#

workspace = special:obsidian, on-created-empty:obsidian
workspace = special:spotify, on-created-empty:spotify

windowrule = float on, match:title ^(Qalculate!)$
windowrule = match:workspace special calc, match:title ^(Qalculate!)$

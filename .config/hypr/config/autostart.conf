# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

source = ~/.config/hypr/config/defaults.conf
exec-once = dbus-update-activation-environment WAYLAND_DISPLAY

# Autostart wiki https://wiki.hyprland.org/0.45.0/Configuring/Keywords/#executing #

exec-once = wpaperd -d &
exec-once = dunst &
# exec-once = __GL_THREADED_OPTIMIZATIONS=0 linux-wallpaperengine --silent --fps 30 --screen-root HDMI-A-1 --screen-root DP-2 24477602742
exec-once = waybar &
#exec-once = fcitx5 -d &
exec-once = syncthingtray --wait &
exec-once = nm-applet --indicator &
exec-once = bash -c "mkfifo /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob && tail -f /tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob | wob & disown" &
exec-once = systemctl --user start hyprpolkitagent
exec-once = hyprctl setcursor "Catppuccin Mocha Mauve" 24

# ## Slow app launch fix
exec-once = systemctl --user import-environment &
exec-once = hash dbus-update-activation-environment 2>/dev/null &
exec-once = dbus-update-activation-environment --systemd &

# ## Idle configuration
exec-once = $idlehandler

# ## Startup Apps
exec-once = [workspace 2 silent] sleep 2 && vesktop --no-sandbox %U 
exec-once = [workspace 3 silent] sleep 2 && Telegram %u
exec-once = [workspace 1 silent] sleep 2 && steam -nochatui -nofriendsui -silent 
exec-once = [workspace 1 silent] sleep 2 && bitwarden
exec-once = [workspace special:obsidian silent] sleep 2 && obsidian
